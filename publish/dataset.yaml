# Declarative scope for publishing the AIMIP Phase 1 submissions as a Hugging Face dataset.
#
# All relative paths are resolved against the directory containing this file.
# Change scope here (e.g. add a new submission directory to `include`), then rerun
# `make stage manifest check` and `make upload`.

repo_id: allenai/aimip-phase1-submissions
repo_type: dataset

# Local tree in the `local_data` layout described in evaluations/README.md, i.e. a
# mirror of the AIMIP archive at the DKRZ S3 store (see `s3_source`).
source_dir: ../local_data

# Where the publishable tree is assembled. Files are hard-linked from `source_dir`,
# so this must be on the same filesystem and costs no extra disk.
staging_dir: ~/hf-staging/aimip-phase1-submissions

# DKRZ archive used by `make fetch-source` to materialize `source_dir` (only works
# while the store is reachable).
s3_source: s3://ai-mip
s3_endpoint: https://s3.dkrz.cloud

# Directories (copied whole) or single files, relative to `source_dir`.
# Evaluation-only scope: everything the E1-E5 notebooks on `main` read.
include:
  - Ai2/ACE2-1-ERA5
  - Ai2/DATASET_CARD.md
  - Ai2/LICENSE-DATASET
  - ArchesWeather/ArchesWeather-V2
  - ArchesWeather/ArchesWeatherGen-V2
  - DLESyM/DLESyM
  - Google/NeuralGCM
  - Google/NeuralGCM-HRD
  - NVIDIA/CMIP6/AIMIP/NVIDIA/cBottle-1-3
  - NVIDIA/README.md
  - NVIDIA/data-card.md
  - NVIDIA/config.json
  - UMD-PARETO/MD-1p5
  # ERA5 references: DKRZ's ESMValTool monthly files (version 3, with their README and
  # recipe) and the daily means built from ARCO-ERA5 by evaluations/notebooks/data_prep
  - ERA5/mon_1deg_dkrz_v3
  - ERA5/day_1deg_arco

# Directory names dropped wherever they appear, at any depth including the root.
exclude_dirs:
  - .ipynb_checkpoints         # Jupyter artefacts, in the source tree and next to edited assets

# fnmatch patterns tested against each file's path relative to `source_dir`.
exclude_globs:
  - "*.nc.~*~"                 # truncated/duplicate upload leftovers (NeuralGCM aimip-p4k r1 daily)
  # ArchesWeatherGen-V2/aimip-era5/ holds 13 files nested one level too deep; each is
  # byte-identical (sha256) to the aimip-p2k file already published at its correct path.
  - "ArchesWeather/ArchesWeatherGen-V2/aimip-era5/*"
  # Superseded versions: the snapshot holds only the versions the evaluations read
  # (NeuralGCM and NeuralGCM-HRD v202603xx, DLESyM v20260406, MD-1.5 v20251217,
  # cBottle-1.3 v20260323). Older versions stay in the phase1-2026-09 revision.
  - "Google/NeuralGCM*/v202512*/*"
  - "DLESyM/DLESyM/*/v20250825/*"
  - "UMD-PARETO/MD-1p5/*/v20251214/*"
  - "NVIDIA/CMIP6/*/v20260120/*"
  - "NVIDIA/CMIP6/*/v20260217/*"

# Small files placed into the staging tree at the same relative path, overriding
# anything linked from `source_dir` (root README.md dataset card, root LICENSE.txt,
# Ai2/README.txt license notice).
assets_dir: assets

# Constraints enforced by `make check`.
expected:
  min_files: 3200
  max_files: 3400
  total_bytes_min: 1.30e12
  total_bytes_max: 1.45e12
  required_root_files:
    - README.md
    - LICENSE.txt
  forbidden_prefixes:
    - ArchesWeather/ArchesWeatherGen-V2/aimip-era5/
    - MPI-M/
    - ERA5/mon/
    - GPCP-SG/
    - Ai2/ACE2-2-ERA5/
    - ERA5/mon_1deg/              # superseded references, published in phase1-2026-09
    - ERA5/day_1deg/
    - ERA5/mon_1deg_arco/         # independent check of the DKRZ files; nothing reads it
  forbidden_dirs:
    - .ipynb_checkpoints
  forbidden_globs:
    - "*.nc.~*~"
    - "Google/NeuralGCM*/v202512*/*"
    - "DLESyM/DLESyM/*/v20250825/*"
    - "UMD-PARETO/MD-1p5/*/v20251214/*"
    - "NVIDIA/CMIP6/*/v20260120/*"
    - "NVIDIA/CMIP6/*/v20260217/*"
